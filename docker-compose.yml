services:
  postgres:
    image: postgres:16-alpine
    container_name: dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado => os dados sobrevivem a `docker compose down`
      - pgdata:/var/lib/postgresql/data
      # Scripts executados apenas na primeira inicializacao do volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbt_user} -d ${POSTGRES_DB:-data_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # UI web opcional para inspecionar o banco (http://localhost:8080)
  adminer:
    image: adminer:5
    container_name: dw_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

volumes:
  pgdata:
    name: data_pipeline_dbt_pgdata
